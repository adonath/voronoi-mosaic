[project]
name = "voronoi_mosaic"
version = "1.0.0"
description = "Create image mosaics using Voronoi tessellation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.8",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "scikit-image>=0.24.0",
    "scipy>=1.13.1",
]

[project.scripts]
voronoi-mosaic = "voronoi_mosaic:cli"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["voronoi_mosaic.py"]
